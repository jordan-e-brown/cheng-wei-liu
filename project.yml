name: ChengWeiLiu
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3
configs:
  Debug: debug
  Release: release

targets:
  ChengWeiLiu:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: SampleData/anki-widget.json
        buildPhase: resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "成为流"
        CFBundleName: ChengWeiLiu
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        CFBundleURLTypes:
          - CFBundleURLName: "$(APP_BUNDLE_ID)"
            CFBundleURLSchemes:
              - chengweiliu
        NSLocalNetworkUsageDescription: "成为流 connects to your Mac-hosted 汉语谈话 development server while both devices are on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/ChengWeiLiu.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: ChengWeiLiu
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: ChengWeiLiuWidget
        embed: true

  ChengWeiLiuWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "成为流"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ChengWeiLiuWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        PRODUCT_NAME: ChengWeiLiuWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  ChengWeiLiuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ChengWeiLiu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanebrown.chengweiliu.tests

  ChengWeiLiuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ChengWeiLiu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanebrown.chengweiliu.uitests

schemes:
  ChengWeiLiu:
    build:
      targets:
        ChengWeiLiu: all
    test:
      targets:
        - ChengWeiLiuTests
        - ChengWeiLiuUITests
